kind = "web"
previewPath = "/"
title = "BTC & ETH Tracker"
version = "1.0.0"
id = "artifacts/btc-eth-tracker"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25247

[services.development]
run = "pnpm --filter @workspace/btc-eth-tracker run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/btc-eth-tracker", "run", "build" ]
publicDir = "artifacts/btc-eth-tracker/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25247"
BASE_PATH = "/"
